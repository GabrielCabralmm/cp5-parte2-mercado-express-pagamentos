<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar conta — Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/}">Mercado Express</a>
    <nav>
        <a th:href="@{/mercado}">Catálogo</a>
        <a th:href="@{/login}">Entrar</a>
    </nav>
</header>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Criar conta</h2>
        <p class="subtitle">Cadastre-se para acessar sua área restrita</p>

        <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
                <div class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}">
                <div class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}">
                <div class="field-error" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Criar conta</button>
        </form>

        <div class="auth-footer">
            Já tem conta? <a th:href="@{/login}">Entrar</a>
        </div>
    </div>
</div>

</body>
</html>
